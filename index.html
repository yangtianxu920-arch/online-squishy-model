<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbe3f1">
<title>电子捏捏</title>
<style>
  :root { --ink:#5b4660; --pill:rgba(255,255,255,.62); --line:rgba(255,255,255,.9); --accent:#ff8fab; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","HarmonyOS Sans SC",system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(120% 90% at 50% 20%, #fff6fb 0%, #fbe3f1 38%, #e3dcff 100%);
    user-select:none; -webkit-user-select:none;
  }
  canvas#stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  .glass { background:var(--pill); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
           box-shadow:0 8px 28px rgba(150,110,170,.16); }
  header { position:fixed; left:112px; top:14px; pointer-events:none; }
  header h1 { margin:0; font-size:24px; letter-spacing:2px; font-weight:800; }
  header p { margin:4px 0 0; font-size:13px; opacity:.7; }
  #topright { position:fixed; right:16px; top:16px; display:flex; gap:8px; align-items:center; }
  button { font:inherit; color:inherit; cursor:pointer; border:none; }
  .pillbtn { height:38px; padding:0 14px; border-radius:999px; font-size:13px; }
  .pillbtn.off { opacity:.6; }
  .icon { width:38px; height:38px; border-radius:50%; font-size:17px; }
  #tools { position:fixed; left:16px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px;
           padding:8px; border-radius:26px; }
  #tools button { width:58px; height:58px; border-radius:20px; background:transparent; font-size:12px; line-height:1.25; transition:.18s; }
  #tools button i { display:block; font-style:normal; font-size:22px; }
  #tools button.on, .seg button.on { background:#fff; box-shadow:0 4px 14px rgba(255,120,160,.28); color:#e0527a; }
  #bottom { position:fixed; left:0; right:0; bottom:16px; display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:none; }
  #bottom > * { pointer-events:auto; }
  .seg { display:flex; gap:4px; padding:5px; border-radius:999px; }
  .seg button { padding:8px 18px; border-radius:999px; background:transparent; font-size:13px; transition:.18s; }
  /* 首页：选一只捏捏点进去 */
  #home { position:fixed; inset:0; overflow-y:auto; padding:56px 20px 40px; display:flex; flex-direction:column; align-items:center; }
  #home h1 { margin:0 0 34px; font-size:40px; letter-spacing:6px; font-weight:800; }
  #home > p { margin:10px 0 26px; font-size:15px; opacity:.7; }
  #home section { width:100%; max-width:1040px; margin-bottom:40px; }
  #home h2 { margin:0 0 16px; font-size:20px; letter-spacing:2px; text-align:center; }
  #home h2 small { font-size:12px; font-weight:400; letter-spacing:0; opacity:.6; margin-left:8px; }
  .grid, .grid.big { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 193px)); gap:18px; justify-content:center; }
  .card { display:flex; flex-direction:column; align-items:center; padding:10px 10px 14px; border-radius:24px; text-align:center;
          transition:transform .18s, box-shadow .18s; }
  button.card:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 18px 40px rgba(255,120,160,.28); }
  button.card:active { transform:scale(.97); }
  .card .thumb { width:100%; aspect-ratio:1; border-radius:20px; background:rgba(255,255,255,.55) center/cover no-repeat;
                 display:flex; align-items:center; justify-content:center; font-size:64px; }
  .card b { margin-top:10px; font-size:15px; }
  .card small { margin-top:3px; font-size:12px; opacity:.65; }
  .card.soon { opacity:.5; }
  #back { position:fixed; left:16px; top:16px; }
  body:not(.playing) :is(header, #topright, #tools, #bottom, #back, canvas#stage) { display:none; }
  body.playing #home { display:none; }
  header h1 { pointer-events:auto; }
  body.clean :is(header, #topright, #tools, #bottom, #back) { display:none; }
  #cleanExit { position:fixed; left:0; top:0; width:84px; height:84px; display:none; background:transparent; z-index:20; }
  body.clean.playing #cleanExit { display:block; }
  /* 操作提示：一只半透明的小手演示动作，不写字；只在头几次出现，做过这个动作以后就不再出现 */
  #hint { position:fixed; left:50%; top:85%; width:200px; height:90px; margin:-45px 0 0 -100px; transform:scale(1.3); pointer-events:none; opacity:0; transition:opacity .5s; z-index:5; }
  #hint.on { opacity:1; }
  #hint svg { position:absolute; inset:0; width:100%; height:100%; }
  #hint i { position:absolute; left:0; top:0; font-style:normal; font-size:38px; line-height:1; opacity:.82;
            offset-path:path('M 34 28 Q 100 60 166 28'); offset-rotate:0deg; offset-anchor:50% 8%; animation:hintSwipe 1.5s ease-in-out infinite alternate; }
  @keyframes hintSwipe { from { offset-distance:0%; } to { offset-distance:100%; } }
  /* 长按提示：小手按在要捏的地方，一圈圆环往里收 */
  #hintHold { position:fixed; left:0; top:0; width:0; height:0; pointer-events:none; opacity:0; transition:opacity .5s; z-index:5; }
  #hintHold.on { opacity:1; }
  #hintHold b { position:absolute; left:-34px; top:-34px; width:68px; height:68px; border-radius:50%; border:3.5px solid rgba(91,70,96,.5); animation:hintRing 1.2s ease-in infinite; }
  #hintHold i { position:absolute; left:-19px; top:-4px; font-style:normal; font-size:38px; line-height:1; opacity:.82; }
  @keyframes hintRing { from { transform:scale(1.5); opacity:0; } 30% { opacity:1; } to { transform:scale(.45); opacity:.9; } }
  /* 手势栏提示：一只小手指着手势栏，顺着一根双向箭头在三个手势之间来回移动；只指着其中一个不动 = 该选这个 */
  #hintTool { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .5s; z-index:5; }
  #hintTool.on { opacity:1; }
  #hintTool svg { position:absolute; inset:0; width:100%; height:100%; }
  #hintTool i { position:absolute; left:-19px; top:-19px; font-style:normal; font-size:38px; line-height:1; opacity:.82; }
  body.clean :is(#hint, #hintHold, #hintTool), body:not(.playing) :is(#hint, #hintHold, #hintTool) { display:none; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:30px; text-align:center; font-size:15px; }
  /* 手机版：顶上一行是 返回 / 重置 / 声音，标题在第二行居中；工具栏横着放在底部，手感栏在它上面 */
  @media (max-width:640px) {
    #back { left:calc(10px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); }
    #topright { right:calc(10px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); gap:6px; }
    header { left:0; right:0; top:calc(58px + env(safe-area-inset-top)); text-align:center; }
    header h1 { font-size:19px; } header p { display:none; }
    #tools { top:auto; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%); flex-direction:row; gap:6px; padding:6px; border-radius:24px; }
    #tools button { width:74px; height:60px; }
    #bottom { bottom:calc(94px + env(safe-area-inset-bottom)); }
    .seg button { padding:8px 14px; }
    #hint { top:75%; transform:none; }
    #home { padding:calc(34px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom)); }
    #home h1 { font-size:30px; margin-bottom:22px; }
    .grid, .grid.big { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
    .card { padding:10px 10px 14px; border-radius:22px; } .card b { font-size:15px; margin-top:8px; } .card small { font-size:11px; }
  }
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { edgeTable, triTable } from 'three/addons/objects/MarchingCubes.js';

/* ───────────────────────── 配置 ───────────────────────── */
// 手感预设：全部用“弹簧常数”表达，与帧率无关
const FEELS = {
  bouncy: { kShape: 600, damp: 15, vol: 1.0,  spread: 0.24 }, // Q弹：回弹快、略带抖动、体积守恒会鼓包
  slow:   { kShape: 36,  damp: 250, vol: 0.003, spread: 0.21 }, // 奶油感：软糯、回弹很慢，坑会留一会儿
  water:  { kShape: 110, damp: 2.5, vol: 1.0, spread: 0.50 },   // 水感：像灌了水的球，软塌、一按别处就鼓、松手晃好几下

};
const TOOLS = {
  // rate = 按下去的速度（越小阻力感越强）；grip = 指尖对表皮的抓力（1 = 捏住后能拎着肉拉扯）
  poke:  { r: 0.17, maxDepth: 0.95, floor: 0.08, rate: 9,   grip: 0 },   // 单指，垂直于表面戳进去
  pinch: { r: 0.18, maxDepth: 1.00, floor: 0.06, rate: 4.5, grip: 1,     // 同一只手的两根手指呈 ∧ 形夹住一块肉
           spread: 0.66, sink: 0.52, hand: 1.9 },
  palm:  { r: 1.75, keep: 0.45, floor: 0, rate: 1.8, grip: 0, plate: true },   // 平板从上往下压，越压越吃力
};
const SUBSTEPS = 6, GRAVITY = 6, K_ANCHOR = 150, FINGER_SPEED = 9;
const coarse = matchMedia('(pointer: coarse)').matches;
let feel = FEELS.bouncy, feelName = 'bouncy', toyName = 'cake', tool = 'poke';

/* ───────────────────────── 渲染基础 ───────────────────────── */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));      // 手机屏幕的像素密度常常是 3 倍；以前封顶在 2 倍，画面是放大显示的，所以发糊
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;          // 蛋黄浆的液面用裁剪平面切出来
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
camera.position.set(0, 1.9, 5.9);

const key = new THREE.DirectionalLight(0xfff4ea, 2.2);
key.position.set(-2.5, 5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 12 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 5;
scene.add(key);
const rim = new THREE.DirectionalLight(0xd9c8ff, 0.9); rim.position.set(3, 2, -3); scene.add(rim);

// 托盘
const plate = new THREE.Mesh(
  new THREE.CylinderGeometry(2.3, 2.36, 0.1, 96),
  new THREE.MeshPhysicalMaterial({ color: 0xfdf3ff, roughness: 0.55, clearcoat: 0.4, clearcoatRoughness: 0.4 })
);
plate.position.y = -0.05; plate.receiveShadow = true; scene.add(plate);

/* ───────────────────────── 建模：二十面球细分 + 小熊外形 ───────────────────────── */
function icosphere(level) {
  const t = (1 + Math.sqrt(5)) / 2;
  let v = [-1,t,0, 1,t,0, -1,-t,0, 1,-t,0, 0,-1,t, 0,1,t, 0,-1,-t, 0,1,-t, t,0,-1, t,0,1, -t,0,-1, -t,0,1];
  let f = [0,11,5, 0,5,1, 0,1,7, 0,7,10, 0,10,11, 1,5,9, 5,11,4, 11,10,2, 10,7,6, 7,1,8,
           3,9,4, 3,4,2, 3,2,6, 3,6,8, 3,8,9, 4,9,5, 2,4,11, 6,2,10, 8,6,7, 9,8,1];
  for (let l = 0; l < level; l++) {
    const cache = new Map(), nf = [];
    const mid = (a, b) => {
      const k = a < b ? a * 1e6 + b : b * 1e6 + a;
      let m = cache.get(k);
      if (m === undefined) {
        m = v.length / 3;
        v.push((v[a*3]+v[b*3])/2, (v[a*3+1]+v[b*3+1])/2, (v[a*3+2]+v[b*3+2])/2);
        cache.set(k, m);
      }
      return m;
    };
    for (let i = 0; i < f.length; i += 3) {
      const a = f[i], b = f[i+1], c = f[i+2], ab = mid(a,b), bc = mid(b,c), ca = mid(c,a);
      nf.push(a,ab,ca, b,bc,ab, c,ca,bc, ab,bc,ca);
    }
    f = nf;
  }
  for (let i = 0; i < v.length; i += 3) {
    const l = Math.hypot(v[i], v[i+1], v[i+2]); v[i] /= l; v[i+1] /= l; v[i+2] /= l;
  }
  return { dirs: new Float32Array(v), tris: new Uint32Array(f) };
}

const EARS = [[-0.66, 0.75, 0], [0.66, 0.75, 0]].map(e => { const l = Math.hypot(...e); return e.map(x => x / l); });
function bearShape(x, y, z) {
  let r = 1;
  for (const e of EARS) {
    const ex = x - e[0], ey = y - e[1], ez = z - e[2];      // 左右宽、前后薄 → 一片立着的圆耳朵
    r += 0.5 * Math.max(0, 1 - Math.sqrt(ex*ex + ey*ey + ez*ez * 1.6) / 0.42);   // 肉乎乎的三角猫耳（圆锥形，前后略扁）
  }
  x *= r * 1.07; y *= r * 0.84; z *= r * 0.98;
  const t = y + 0.5;                                  // 底部压平，像坐在桌面上
  y = -0.5 + 0.625 * t + 0.375 * Math.sqrt(t * t + 0.015);

function slimeSurface() {

function slimePick(ray) {          // 射线打到的第一个粒子；法线取“命中点背离附近粒子重心”的方向
